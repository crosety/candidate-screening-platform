# Opt-in overlay. The source key stays in its existing private canonical location.
services:
  api:
    environment:
      JEV_MODE: ${JEV_MODE:-synthetic}
      AI_GATEWAY_API_KEY_FILE: /run/secrets/ai_gateway_api_key
    secrets: [ai_gateway_api_key]
  worker:
    environment:
      JEV_MODE: ${JEV_MODE:-synthetic}
      AI_GATEWAY_API_KEY_FILE: /run/secrets/ai_gateway_api_key
    secrets: [ai_gateway_api_key]
secrets:
  ai_gateway_api_key:
    file: ${AI_GATEWAY_API_KEY_FILE:?Set the absolute path to the private gateway key}
