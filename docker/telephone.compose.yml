# Opt-in. Spanish mobile calls require consent, expiry, and bounded spending.
services:
  api:
    environment:
      TWILIO_VOICE_CONFIG_FILE: /run/secrets/twilio_voice
    secrets: [twilio_voice]
  worker:
    environment:
      TWILIO_VOICE_CONFIG_FILE: /run/secrets/twilio_voice
      ELEVEN_DIRECT_AGENTS_FILE: /run/voice/agents.json
      ELEVENLABS_API_KEY_FILE: /run/secrets/elevenlabs_api_key
    secrets: [twilio_voice, elevenlabs_api_key]
    volumes:
      - ./.runtime-secrets/direct:/run/voice:ro
  telephone:
    extends:
      file: docker-compose.yml
      service: api
    environment:
      TWILIO_VOICE_CONFIG_FILE: /run/secrets/twilio_voice
      ELEVEN_DIRECT_AGENTS_FILE: /run/voice/agents.json
      ELEVENLABS_API_KEY_FILE: /run/secrets/elevenlabs_api_key
      JEV_MODE: ${JEV_MODE:-synthetic}
      AI_GATEWAY_API_KEY_FILE: /run/secrets/ai_gateway_api_key
    secrets: [twilio_voice, elevenlabs_api_key, ai_gateway_api_key]
    volumes:
      - ./.runtime-secrets/direct:/run/voice:ro
    command: uvicorn web.telephone_ingress:application --host 0.0.0.0 --port 8003 --lifespan off --no-access-log --log-level warning
    ports: !override ["127.0.0.1:8003:8003"]
    healthcheck:
      test: ["CMD", "python", "-c", "import socket; s=socket.create_connection(('127.0.0.1',8003),2); s.close()"]
secrets:
  twilio_voice:
    file: ./.runtime-secrets/twilio_voice.json
