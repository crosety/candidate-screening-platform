openapi: 3.1.0
jsonSchemaDialect: https://json-schema.org/draft/2020-12/schema
info:
  title: Integración ATS · Plataforma de cribado
  version: 1.0.0
  summary: Contrato entre el ATS de un cliente y la plataforma de cribado con agentes de IA.
  description: |
    Especificación de la integración entre el ATS de un cliente (en el caso práctico,
    Grupo Sazón) y la plataforma de cribado. Cubre tres direcciones:

    1. **Ingesta** (`paths`): el ATS crea o recupera una candidatura y recibe el enlace
       personal del candidato. Implementada tal como se describe.
    2. **Escritura de vuelta** (`webhooks` `ats.write_result` y `ats.set_stage`): lo que
       la plataforma escribe hoy en el ATS a través del conector. Las cargas y el acuse
       están implementados; el transporte HTTP firmado que aquí se describe es una
       propuesta, porque hoy solo existe el conector nativo del ATS simulado.
    3. **Eventos** (resto de `webhooks`): notificaciones de cribado completado, entrevista,
       derivación a una persona, baja y supresión. Propuestas, con cargas derivadas de los
       datos que la plataforma ya produce.

    Cada operación, respuesta, cabecera o propiedad lleva `x-status`:
    `implemented` (lo hace el código actual y lo comprueba
    `tests/contracts/test_ats_spec.py`) o `proposed` (diseño para una integración real,
    todavía sin código). Un elemento sin `x-status` hereda el de su contenedor.

    La instalación incluye un ATS local que implementa este contrato para desarrollo y
    pruebas; no hay una integración certificada con un proveedor comercial. Todos los
    nombres, teléfonos e identificadores de los ejemplos son ficticios.
  contact:
    name: Forward Deployed Engineering
  license:
    name: Uso interno del caso práctico
    identifier: LicenseRef-Proprietary
  x-status: implemented
servers:
  - url: https://{host}/api/v1
    description: Instancia de la plataforma. La ingesta no se publica en el túnel externo.
    variables:
      host:
        default: cribado.example.com
tags:
  - name: ingesta
    description: Entrada de candidaturas desde el ATS autorizado.
  - name: privacidad
    description: Peticiones de supresión iniciadas por el ATS.
  - name: escritura
    description: Escrituras de la plataforma en el ATS (resultado y etapa).
  - name: eventos
    description: Notificaciones de la plataforma al ATS.
paths:
  /ingest/{tenant_slug}/applications:
    post:
      operationId: ingestApplication
      tags: [ingesta]
      summary: Crear o recuperar una candidatura
      description: |
        Alta idempotente por `(tenant_slug, external_id)`. Si la candidatura ya existe, se
        actualizan nombre, teléfono, ciudad, zona horaria y segmento, y se devuelve la misma
        `application_id` y el mismo enlace: repetir la ingesta con una firma nueva es la forma
        segura de recuperar un acuse perdido. Cambiar `job_ref` de una candidatura existente
        devuelve 409.

        Orden de evaluación real: Django Ninja valida el cuerpo antes de ejecutar la vista,
        así que un cuerpo inválido devuelve 400 aunque falte la firma; después se comprueba
        la firma (401), la repetición del nonce (409/503) y por último el alta (404/409).

        Efectos: si el cliente tiene WhatsApp con plantilla de primer contacto y el envío está
        habilitado en el servidor, se encola un primer contacto idempotente. `job_ref` no se
        valida contra las ofertas publicadas en este paso: una oferta inexistente o cerrada
        falla al abrir la conversación (propuesta: 422 en la ingesta).

        `candidate_link` es un secreto personal del candidato: no debe registrarse en logs ni
        compartirse fuera del canal acordado con el candidato.
      x-status: implemented
      x-source: src/web/conversations/api.py::ingest
      security:
        - ingestSignature: []
      parameters:
        - $ref: '#/components/parameters/TenantSlug'
        - $ref: '#/components/parameters/IngestTimestamp'
        - $ref: '#/components/parameters/IngestNonce'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IngestApplication'
            examples:
              nueva:
                summary: Alta de una candidata desde el ATS
                value:
                  external_id: SAZ-000123
                  candidate_name: Lucía Martín Ferrer
                  phone: '+34600000000'
                  city: València
                  job_ref: repartidores
                  timezone: Europe/Madrid
                  segment: València
              minima:
                summary: Solo los campos obligatorios (zona horaria Europe/Madrid por defecto)
                value:
                  external_id: SAZ-000124
                  candidate_name: Andrés Gil Soto
                  phone: ''
                  city: Ciudad de México
                  job_ref: repartidores
      responses:
        '200':
          description: |
            Candidatura creada o recuperada. Repetir la misma `external_id` devuelve el mismo
            `application_id` y el mismo `candidate_link`.
          x-status: implemented
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IngestResult'
              examples:
                creada:
                  value:
                    application_id: 0b9d7c4e-5f1a-4c2b-9e3d-7a6f5e4d3c2b
                    candidate_link: https://candidatos.example.com/c/3f9a1c7e5b2d4f6a8c0e1b3d5f7a9c1e3b5d7f9a1c3e5b7d9f1a3c5e7b9d1f3a
        '400':
          description: |
            Cuerpo no válido según el esquema (campo ausente, longitud, zona horaria IANA
            inexistente o JSON mal formado). Hoy `detail` lleva el primer error de validación.
          x-status: implemented
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
              examples:
                zona_horaria_invalida:
                  summary: Zona horaria que no existe en la base IANA
                  value:
                    detail: 'Entrada no válida: Value error, Zona horaria no válida'
                  x-trigger: invalid_body
                  x-signed: true
                  x-request-body:
                    external_id: SAZ-000125
                    candidate_name: Marta Ruiz Pons
                    phone: '+34600000001'
                    city: València
                    job_ref: repartidores
                    timezone: Europe/Valencia
                campo_ausente_sin_firma:
                  summary: Falta un campo obligatorio; se rechaza antes de mirar la firma
                  value:
                    detail: 'Entrada no válida: Field required'
                  x-trigger: invalid_body
                  x-signed: false
                  x-request-body:
                    external_id: SAZ-000126
                    phone: '+34600000002'
                    city: València
                    job_ref: repartidores
        '401':
          description: |
            Firma ausente, mal formada, de otro cliente o fuera de la ventana temporal
            (más de 300 s en el pasado o más de 30 s en el futuro), o servidor sin raíz de
            ingesta configurada. No se distingue la causa para no orientar a un atacante.
          x-status: implemented
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
              examples:
                firma_no_valida:
                  value:
                    detail: Firma de ingesta no válida o caducada
                  x-trigger: bad_signature
        '404':
          description: |
            Cliente inexistente (solo alcanzable con una clave derivada para ese
            identificador) o candidatura suprimida por privacidad. Para la supresión se
            propone 410.
          x-status: implemented
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
              examples:
                cliente_desconocido:
                  value:
                    detail: Cliente no encontrado
                  x-trigger: unknown_tenant
                candidatura_suprimida:
                  value:
                    detail: Candidatura retirada
                  x-trigger: erased
        '409':
          description: |
            Conflicto. Tres causas reales: nonce ya usado dentro de la ventana de 360 s
            (repetir con nonce y firma nuevos, nunca reenviar la misma petición), cambio de
            oferta de una candidatura existente, o enlace del candidato revocado o caducado,
            que exige una renovación explícita por parte de selección.
          x-status: implemented
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
              examples:
                nonce_repetido:
                  value:
                    detail: Petición ya recibida; usa una nueva firma para consultar el resultado
                  x-trigger: replay
                cambio_de_oferta:
                  value:
                    detail: Una candidatura existente no puede cambiar de oferta.
                  x-trigger: job_ref_changed
                enlace_por_renovar:
                  value:
                    detail: El enlace anterior necesita renovación explícita por selección.
                  x-trigger: link_needs_renewal
        '410':
          description: |
            Propuesto para sustituir al 404 actual cuando la candidatura fue suprimida por
            privacidad: el ATS debe dejar de reenviarla y no crear otra con el mismo
            `external_id`.
          x-status: proposed
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              examples:
                suprimida:
                  value:
                    type: https://cribado.example.com/problemas/candidatura-suprimida
                    title: Candidatura suprimida
                    status: 410
                    detail: Los datos de esta candidatura se retiraron a petición de la persona.
                    code: application_erased
        '413':
          description: Propuesto. Cuerpo mayor de 16 KiB. Hoy solo aplica el límite general de Django (2,5 MiB).
          x-status: proposed
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              examples:
                demasiado_grande:
                  value:
                    type: https://cribado.example.com/problemas/cuerpo-demasiado-grande
                    title: Cuerpo demasiado grande
                    status: 413
                    detail: El cuerpo supera 16 KiB.
                    code: payload_too_large
        '422':
          description: |
            Propuesto. Cuerpo válido pero no procesable: `job_ref` que no es una oferta
            publicada y abierta del cliente, o `phone` que no está en formato E.164. Hoy la
            ingesta acepta la candidatura y el error aparece al abrir la conversación.
          x-status: proposed
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              examples:
                oferta_no_publicada:
                  value:
                    type: https://cribado.example.com/problemas/oferta-no-disponible
                    title: Oferta no disponible
                    status: 422
                    detail: La oferta «cocina» no está publicada para este cliente.
                    code: offer_not_open
        '429':
          description: |
            Propuesto. Límite por cliente (ver `x-limits`). Hoy la ingesta no tiene límite
            propio: el volumen lo controla el ATS autorizado.
          x-status: proposed
          headers:
            Retry-After:
              $ref: '#/components/headers/RetryAfter'
            RateLimit-Limit:
              $ref: '#/components/headers/RateLimitLimit'
            RateLimit-Remaining:
              $ref: '#/components/headers/RateLimitRemaining'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              examples:
                limite:
                  value:
                    type: https://cribado.example.com/problemas/demasiadas-peticiones
                    title: Demasiadas peticiones
                    status: 429
                    detail: Se ha superado el límite de 120 ingestas por minuto.
                    code: rate_limited
        '503':
          description: |
            No se puede comprobar la repetición porque la caché (Redis) no responde. La
            petición no se ha procesado: repetir con nonce y firma nuevos. `Retry-After` es
            una propuesta.
          x-status: implemented
          headers:
            Retry-After:
              $ref: '#/components/headers/RetryAfter'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
              examples:
                cache_no_disponible:
                  value:
                    detail: No se puede verificar la repetición de la ingesta
                  x-trigger: cache_unavailable
  /ingest/{tenant_slug}/applications/{external_id}/erasure-requests:
    post:
      operationId: requestApplicationErasure
      tags: [privacidad]
      summary: Pedir la supresión de una candidatura desde el ATS
      description: |
        Propuesto. Hoy la supresión es un comando auditado del operador
        (`manage.py redact_candidate --apply`) que exige pausar el worker del cliente. Esta
        operación la encolaría con la misma firma de ingesta y respondería 202; al terminar,
        la plataforma emitiría `candidate.erased`. La referencia del expediente es opaca y no
        debe contener datos personales.
      x-status: proposed
      security:
        - ingestSignature: []
      parameters:
        - $ref: '#/components/parameters/TenantSlug'
        - name: external_id
          in: path
          required: true
          description: Identificador de la candidatura en el ATS, codificado para URL.
          schema:
            type: string
            minLength: 1
            maxLength: 60
        - $ref: '#/components/parameters/IngestTimestamp'
        - $ref: '#/components/parameters/IngestNonce'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ErasureRequest'
            examples:
              solicitud:
                value:
                  case_ref: RGPD-2026-0042
                  requested_at: '2026-10-28T09:15:00Z'
      responses:
        '202':
          description: Supresión aceptada y encolada. El resultado llega como `candidate.erased`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErasureAccepted'
              examples:
                aceptada:
                  value:
                    status: accepted
                    case_ref: RGPD-2026-0042
        '401':
          description: Firma no válida (mismas reglas que la ingesta).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '410':
          description: La candidatura ya estaba suprimida; la petición es idempotente y no repite efectos.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '429':
          description: Límite por cliente.
          headers:
            Retry-After:
              $ref: '#/components/headers/RetryAfter'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '503':
          description: Caché o base de datos no disponible; repetir con nonce y firma nuevos.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
webhooks:
  ats.write_result:
    post:
      operationId: atsWriteResult
      tags: [escritura]
      summary: Escribir el resultado del cribado en el ATS
      description: |
        Carga implementada: la crea `enqueue_write_result` cuando una decisión queda
        aplicada (aprobación automática de un apto con nivel 2 o superior y sin señales, o
        confirmación/corrección humana) y el worker la entrega con la operación
        `write_result` del conector ATS con permiso de escritura. `fields` contiene solo los campos con valor no nulo, con la
        clave `ats_field` del esquema de resultado del perfil. `stage` es el ajuste
        `stage_{verdict}` de la conexión; vacío si no está configurado.

        Transporte actual: conector nativo `sim_ats` (en proceso). El adaptador MCP no
        implementa esta operación. El transporte HTTP firmado (cabeceras de este webhook) es
        una propuesta. Hoy la clave idempotente se guarda en la plataforma pero no viaja al
        ATS: un ATS real debe recibirla en `Idempotency-Key` para deduplicar.

        Riesgo conocido de orden: si una escritura de resultado se reintenta después de que
        ya se aplicara `ats.set_stage`, el ATS volvería a la etapa de apto. Ver `x-delivery`.
      x-status: implemented
      x-transport:
        implemented: conector nativo sim_ats, operación write_result
        proposed: POST HTTPS firmado al endpoint registrado por el cliente
      x-outbox-kind: ats.write_result
      x-idempotency-key-template: write_result:{decision_id}
      x-source: src/screening/application/assessment.py::enqueue_write_result
      parameters:
        - $ref: '#/components/parameters/WebhookEventId'
        - $ref: '#/components/parameters/WebhookTimestamp'
        - $ref: '#/components/parameters/WebhookSignature'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AtsWriteResultCommand'
            examples:
              apta:
                summary: Resultado de Lucía, apta con aplicación automática
                value:
                  application_external_id: SAZ-000123
                  verdict: qualified
                  fields:
                    candidate.name: Lucía Martín Ferrer
                    custom.licencia: true
                    custom.tipo_licencia: B
                    custom.ciudad: València
                    custom.zona: Russafa
                    custom.local: Sazón Ruzafa
                    custom.disponibilidad: media jornada
                    custom.turno: tarde
                    custom.experiencia_anios: 2
                    custom.experiencia_plataforma: Glovo
                    custom.fecha_inicio: '2026-11-02'
                  summary: Carnet B vigente, vive en Russafa (València) y acepta Sazón Ruzafa. Media jornada de tarde, dos años en Glovo; puede empezar el 02/11/2026.
                  stage: Cribado superado
      responses:
        '200':
          description: |
            Acuse implementado: el conector debe devolver exactamente `{"status": "ok"}`.
            Cualquier otra respuesta o excepción deja el efecto pendiente y se reintenta.
          x-status: implemented
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConnectorAck'
              examples:
                ok:
                  value:
                    status: ok
        '409':
          description: |
            Propuesto. La clave idempotente ya se aplicó con la misma carga: la plataforma lo
            trata como entregado. Con una carga distinta, el ATS debe responder 422.
          x-status: proposed
        '422':
          description: Propuesto. Carga rechazada de forma definitiva (por ejemplo, campo inexistente en el ATS); no se reintenta y pasa a revisión manual.
          x-status: proposed
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        default:
          description: Error transitorio o desconocido; se reintenta según `x-delivery`.
          x-status: implemented
  ats.set_stage:
    post:
      operationId: atsSetStage
      tags: [escritura]
      summary: Mover la candidatura a la etapa de entrevista
      description: |
        Carga implementada: la crea la política de reserva cuando el candidato reserva una
        entrevista, con la etapa `stage_interview` de la conexión y una nota legible. Mismo
        transporte, acuse y reintentos que `ats.write_result`.
      x-status: implemented
      x-transport:
        implemented: conector nativo sim_ats, operación set_stage
        proposed: POST HTTPS firmado al endpoint registrado por el cliente
      x-outbox-kind: ats.set_stage
      x-idempotency-key-template: set_stage:{session_id}:interview
      x-source: src/screening/application/assessment.py::DecisionBookingPolicy.booked
      parameters:
        - $ref: '#/components/parameters/WebhookEventId'
        - $ref: '#/components/parameters/WebhookTimestamp'
        - $ref: '#/components/parameters/WebhookSignature'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AtsSetStageCommand'
            examples:
              entrevista:
                value:
                  application_external_id: SAZ-000123
                  stage: Entrevista
                  note: 'Entrevista: jueves 29/10/2026 16:00 en Sazón Ruzafa'
      responses:
        '200':
          description: 'Acuse implementado: `{"status": "ok"}`.'
          x-status: implemented
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConnectorAck'
        default:
          description: Error transitorio o desconocido; se reintenta según `x-delivery`.
          x-status: implemented
  screening.completed:
    post:
      operationId: screeningCompleted
      tags: [eventos]
      summary: Cribado completado
      description: |
        Propuesto. Se emitiría al guardar el resultado de la evaluación, haya o no decisión
        aplicada. Con `decision.status = proposed` el ATS no debe mover la etapa: la escritura
        definitiva llega después como `ats.write_result`, tras la revisión humana. La carga
        reutiliza el resultado real (veredicto, campos con valor/evidencia/confianza,
        resumen, motivo, señales y observación de sentimiento por etapa).
      x-status: proposed
      x-idempotency-key-template: screening.completed:{session_id}
      parameters:
        - $ref: '#/components/parameters/WebhookEventId'
        - $ref: '#/components/parameters/WebhookTimestamp'
        - $ref: '#/components/parameters/WebhookSignature'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ScreeningCompletedEvent'
            examples:
              apta:
                value:
                  event_id: 5c0e2f4a-8b1d-4e6f-9a3c-2d7b5e1f0a9c
