components:
  securitySchemes:
    ingestSignature:
      type: apiKey
      in: header
      name: X-Ingest-Signature
      description: |
        HMAC-SHA256 en hexadecimal (64 caracteres en minúscula) con la clave del cliente.
        La clave del cliente es el hex de HMAC-SHA256(raíz del servidor, `ingest-v1:{tenant_slug}`);
        se entrega al ATS con `manage.py export_ingest_key` en un fichero 0600 y nunca se
        entrega la raíz. El mensaje firmado son cinco líneas separadas por `\n`:
        `X-Ingest-Timestamp`, `X-Ingest-Nonce`, `POST`, la ruta exacta sin query
        (`/api/v1/ingest/{tenant_slug}/applications`) y el SHA-256 hex de los bytes del cuerpo.
        La comparación es de tiempo constante. Rotar la raíz invalida todas las claves.
      x-status: implemented
      x-source: src/web/conversations/ingest_auth.py::authenticate_ingest
      x-pattern: ^[0-9a-f]{64}$
      x-signature-test-vector:
        description: Vector de prueba con una raíz pública ficticia. No es una credencial.
        root: raiz-de-ejemplo-no-usar-en-produccion
        tenant_slug: grupo_sazon
        tenant_key: 25b83e7efa0fc0852721461b11aeb358212c1070dd347eb6d604324c7d89260c
        timestamp: '1793201400'
        nonce: 7f3c2a9e4b1d4c08a6e5f0b2c9d8e7a1
        path: /api/v1/ingest/grupo_sazon/applications
        body: '{"external_id":"SAZ-000123","candidate_name":"Lucía Martín Ferrer","phone":"+34600000000","city":"València","job_ref":"repartidores","timezone":"Europe/Madrid","segment":"València"}'
        body_sha256: a46472bda5d16e19ebb7de4a58c85c1a91e55ba1fa160cd9a0dbc2e915569a3f
        signature: 7a90397c9d51ea707b7dd8a2d618b212b0c914be5fb8c7ba8fcd3d2d5acd6376
  parameters:
    TenantSlug:
      name: tenant_slug
      in: path
      required: true
      description: Identificador del cliente en la plataforma. Forma parte del mensaje firmado.
      schema:
        type: string
        pattern: ^[a-z0-9_]+$
        maxLength: 40
      example: grupo_sazon
    IngestTimestamp:
      name: X-Ingest-Timestamp
      in: header
      required: true
      description: Segundos Unix (10 cifras). Ventana aceptada de 300 s hacia atrás y 30 s hacia delante.
      x-status: implemented
      schema:
        type: string
        pattern: ^[0-9]{10}$
      example: '1793201400'
    IngestNonce:
      name: X-Ingest-Nonce
      in: header
      required: true
      description: Valor nuevo en cada petición. Se recuerda 360 s por cliente; repetirlo devuelve 409.
      x-status: implemented
      schema:
        type: string
        pattern: ^[a-zA-Z0-9_-]{16,80}$
      example: 7f3c2a9e4b1d4c08a6e5f0b2c9d8e7a1
    WebhookEventId:
      name: X-Screening-Event-Id
      in: header
      required: true
      description: Identificador único de la entrega lógica; se repite igual en cada reintento.
      x-status: proposed
      schema:
        type: string
        format: uuid
      example: 5c0e2f4a-8b1d-4e6f-9a3c-2d7b5e1f0a9c
    WebhookTimestamp:
      name: X-Screening-Timestamp
      in: header
      required: true
      description: Segundos Unix del intento. El ATS debe rechazar desfases de más de 300 s.
      x-status: proposed
      schema:
        type: string
        pattern: ^[0-9]{10}$
      example: '1793205730'
    WebhookSignature:
      name: X-Screening-Signature
      in: header
      required: true
      description: |
        `v1=` seguido del HMAC-SHA256 hex con la clave de webhooks del cliente (distinta de la
        de ingesta) sobre cinco líneas: timestamp, event id, `POST`, ruta del endpoint del ATS
        y SHA-256 hex del cuerpo. Mismo esquema que la ingesta para reutilizar la verificación.
        Durante una rotación se envían dos firmas separadas por coma.
      x-status: proposed
      schema:
        type: string
        pattern: ^v1=[0-9a-f]{64}(,v1=[0-9a-f]{64})?$
      example: v1=3b1f0c9d8e7a6b5c4d3e2f1a0b9c8d7e6f5a4b3c2d1e0f9a8b7c6d5e4f3a2b1c
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: |
        Clave idempotente de la entrega. Para las escrituras coincide con la del outbox
        (`write_result:{decision_id}`, `set_stage:{session_id}:interview`); hoy se guarda en
        la plataforma pero no se transmite al conector.
      x-status: proposed
      schema:
        type: string
        minLength: 1
        maxLength: 200
      example: write_result:9e8d7c6b-5a4f-4e3d-8c2b-1a0f9e8d7c6b
  headers:
    RetryAfter:
      description: Segundos que el cliente debe esperar antes de repetir.
      x-status: proposed
      schema:
        type: integer
        minimum: 1
      example: 30
    RateLimitLimit:
      description: Peticiones permitidas en la ventana actual.
      x-status: proposed
      schema:
        type: integer
        minimum: 1
      example: 120
    RateLimitRemaining:
      description: Peticiones restantes en la ventana actual.
      x-status: proposed
      schema:
        type: integer
        minimum: 0
      example: 0
  responses:
    WebhookAccepted:
      description: Recibido y aplicado (o encolado de forma duradera) por el ATS. Cualquier 2xx cuenta como entrega.
      x-status: proposed
    WebhookDuplicate:
      description: Clave idempotente ya aplicada; la plataforma lo trata como entregado.
      x-status: proposed
    WebhookRetry:
      description: Cualquier otro estado, tiempo agotado o error de red; se reintenta según `x-delivery`.
      x-status: proposed
  schemas:
    Problem:
      type: object
      description: |
        Error compartido. Hoy la API devuelve `application/json` con solo `detail` (texto en
        español). La propuesta lo amplía a RFC 9457 (`application/problem+json`) sin romper a
        quien ya lea `detail`.
      required: [detail]
      additionalProperties: false
      properties:
        detail:
          type: string
          description: Explicación legible en español.
          x-status: implemented
        type:
          type: string
          format: uri-reference
          x-status: proposed
        title:
          type: string
          x-status: proposed
        status:
          type: integer
          minimum: 400
          maximum: 599
          x-status: proposed
        instance:
          type: string
          x-status: proposed
        code:
          type: string
          pattern: ^[a-z][a-z0-9_]*$
          description: Código estable para automatizar el tratamiento del error.
          x-status: proposed
    IngestApplication:
      type: object
      description: |
        Cuerpo de la ingesta; equivale a `NewApplicationIn`. Los campos desconocidos se
        ignoran. `timezone` debe existir en la base IANA del servidor.
      x-status: implemented
      x-source: src/web/conversations/schemas.py::NewApplicationIn
      required: [external_id, candidate_name, phone, city, job_ref]
      properties:
        external_id:
          type: string
          minLength: 1
          maxLength: 60
          description: Identificador estable de la candidatura en el ATS; clave idempotente de la ingesta.
        candidate_name:
          type: string
          minLength: 1
          maxLength: 200
        phone:
          type: string
          maxLength: 30
          description: Teléfono para canales de mensajería; puede ir vacío. Propuesto exigir E.164.
        city:
          type: string
          maxLength: 120
        job_ref:
          type: string
          maxLength: 60
          description: Clave de la oferta en el perfil del cliente (por ejemplo, `repartidores`).
        timezone:
          type: string
          maxLength: 40
          default: Europe/Madrid
          description: Zona horaria IANA del candidato.
        segment:
          type: string
          maxLength: 60
          default: ''
          description: Segmento de despliegue gradual (por ejemplo, la ciudad). Procede de la ingesta confiable.
    IngestResult:
      type: object
      x-status: implemented
      x-source: src/web/conversations/schemas.py::IngestOut
      required: [application_id, candidate_link]
      additionalProperties: false
      properties:
        application_id:
          type: string
          format: uuid
        candidate_link:
          type: string
          format: uri
          pattern: ^https?://.+/c/[0-9a-f]{64}$
          description: Enlace personal del candidato. Secreto; no registrar en logs.
    ErasureRequest:
      type: object
      x-status: proposed
      required: [case_ref]
      additionalProperties: false
      properties:
        case_ref:
          type: string
          pattern: ^[A-Za-z0-9_-]{1,100}$
          description: Referencia opaca del expediente (mismas reglas que `redact_candidate --case-ref`).
        requested_at:
          type: string
          format: date-time
    ErasureAccepted:
      type: object
      x-status: proposed
      required: [status, case_ref]
      additionalProperties: false
      properties:
        status:
          const: accepted
        case_ref:
          type: string
    ConnectorAck:
      type: object
