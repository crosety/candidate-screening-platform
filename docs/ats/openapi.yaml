    result_keys: [carnet, tipo_carnet]
  - name: Ciudad / zona
    validation: Dentro de las áreas de servicio; se concreta en un local con vacantes que el candidato acepta.
    result_keys: [ciudad, zona, local_asignado]
  - name: Disponibilidad
    validation: Jornada completa, media jornada (parcial) o fines de semana.
    result_keys: [disponibilidad]
  - name: Horario preferido
    validation: Mañana, tarde, noche o flexible.
    result_keys: [turno]
  - name: Experiencia previa en reparto
    validation: Años y plataforma; opcional y nunca inferida.
    result_keys: [experiencia_anios, experiencia_plataforma]
  - name: Fecha de incorporación
    validation: Fecha ISO futura en la zona horaria del candidato.
    result_keys: [incorporacion]
x-delivery:
  semantics: at-least-once
  implemented:
    outbox: Efecto guardado con clave idempotente única antes de encolar; estados pending, sent y dead.
    max_attempts: 5
    backoff_seconds: min(2^intento, 300) tras cada fallo (2, 4, 8 y 16 s)
    connector_timeout_seconds: 10 en el adaptador MCP; sin límite propio en el conector nativo
    reconciliation_interval_seconds: 60
    stale_job_minutes: 10
    on_exhaustion: El efecto pasa a dead y queda para revisión manual; no se repite a ciegas una escritura ambigua.
    ordering: Sin garantía entre efectos de la misma candidatura; cada uno es un trabajo independiente.
  proposed:
    max_attempts: 8
    backoff_seconds: exponencial con jitter, de 2 s a 1 h, durante 24 h como máximo
    request_timeout_seconds: 10
    success: Cualquier 2xx o 409 por clave ya aplicada.
    non_retryable: 400, 401, 403, 404, 410 y 422 pasan a revisión manual sin reintentos.
    ordering: El ATS aplica cambios de etapa solo si `sequence` supera la última aplicada para esa candidatura.
    reconciliation: Ante un tiempo agotado se consulta el estado en el ATS por clave idempotente antes de repetir.
x-versioning:
  implemented:
    - La ruta lleva la versión mayor (`/api/v1`).
    - La derivación de la clave de ingesta lleva su versión (`ingest-v1:{tenant_slug}`).
  proposed:
    - Cambios aditivos (campos opcionales nuevos, nuevos eventos) sin aviso; los consumidores ignoran lo desconocido.
    - Un cambio incompatible crea `/api/v2` o `schema_version` nuevo y convive seis meses con el anterior.
    - Las respuestas de una versión en retirada llevan la cabecera `Sunset` (RFC 8594).
    - '`info.version` sigue SemVer: mayor para incompatibles, menor para aditivos, parche para texto.'
x-limits:
  implemented:
    ingest_body: Validación por campo (external_id ≤ 60, candidate_name ≤ 200, phone ≤ 30, city ≤ 120, job_ref ≤ 60, timezone ≤ 40, segment ≤ 60) y límite general de Django de 2,5 MiB.
    replay_window_seconds: 300 hacia atrás, 30 hacia delante; nonce recordado 360 s.
    ingest_rate: Sin límite propio en la ingesta.
  proposed:
    ingest_rate: 120 peticiones por minuto y cliente, ráfaga de 30; 429 con Retry-After.
    ingest_body_bytes: 16384
    webhook_body_bytes: 65536
    webhook_concurrency: 4 entregas simultáneas por cliente.
