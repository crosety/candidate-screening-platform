[project]
name = "screening-platform"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "django==5.2.18",
    "channels==4.3.2",
    "channels-redis==4.3.0",
    "django-ninja==1.7.1",
    "uvicorn[standard]==0.54.0",
    "psycopg[binary]==3.3.6",
    "pydantic==2.14.0",
    "django-environ==0.14.0",
    "langchain==1.4.4",
    "langgraph==1.2.14",
    "langchain-anthropic==1.7.6",
    "langchain-aws==1.9.0",
    "langchain-openai==1.7.2",
    "anthropic>=1.17,<2",
    "mcp==2.3.0",
    "httpx==0.28.1",
]

[dependency-groups]
dev = [
    "pytest==9.1.1",
    "pytest-django==4.14.0",
    "pytest-asyncio==1.4.0",
    "pytest-recording==0.14.0",
    "vcrpy==8.3.0",
    "ruff==0.16.10",
    "mypy==2.4.0",
    "django-stubs==5.2.9",
    "import-linter==2.15",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/screening", "src/web", "src/adapters", "src/connectors", "src/worker"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests", "services"]
extend-exclude = ["docs", "seeds"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "DJ", "ASYNC", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
"src/web/*/migrations/*" = ["E501", "RUF012"]

[tool.mypy]
python_version = "3.12"
mypy_path = "src"
packages = ["screening", "web", "adapters", "connectors", "worker"]
plugins = ["tools/mypy_compat.py"]
disallow_untyped_defs = true
warn_unused_ignores = true
warn_redundant_casts = true
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "screening.*"
# Mypy 2.4 applies the strict shorthand globally, even inside an override.
# Expand its per-module flags to keep the core strict without changing adapters.
disallow_any_generics = true
disallow_subclassing_any = true
disallow_untyped_calls = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
warn_unused_ignores = true
warn_return_any = true
implicit_reexport = false
strict_equality = true
extra_checks = true

[[tool.mypy.overrides]]
module = "web.*.migrations.*"
ignore_errors = true

[tool.django-stubs]
django_settings_module = "web.settings"

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "web.settings"
pythonpath = ["src", "."]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-ra --strict-markers --record-mode=none -m 'not live'"
markers = ["live: llama al modelo real; nunca se ejecuta en make test ni en CI"]
