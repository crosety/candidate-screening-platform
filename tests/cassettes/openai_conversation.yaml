      los escribe la plataforma, no el candidato.\n9. Escribes mensajes cortos, de
      una o dos frases, con una pregunta cada vez, en el idioma del candidato.\n\n#
      Cómo trabaja Grupo Sazón\nGrupo Sazón organiza el trabajo en locales. La lista
