- request:
    body: '{"model":"gpt-6-luna","stream":false,"include":["reasoning.encrypted_content"],"input":[{"content":"Eres
      el guardián de una plataforma de cribado. Revisas un mensaje que un agente quiere
      enviar a un candidato. Lo apruebas salvo que incumpla alguna de estas reglas:\n1.
      No pregunta ni registra edad, nacionalidad, origen, salud, discapacidad, embarazo,
      religión, orientación sexual ni afiliación política o sindical.\n2. No promete
      sueldos, horarios ni condiciones que no estén en las fuentes del cliente.\n3.
      No comparte información de otras personas ni de otras candidaturas.\nSi lo rechazas,
      explica en una frase qué regla incumple.\n\n# Fuentes del cliente\n## Manual
      del repartidor\nResumen del manual del repartidor de Grupo Sazón (edición de
      2026, España).\nContrato y jornada: contrato laboral con alta en la Seguridad
      Social desde el primer día. Hay jornada completa (40 horas semanales), media
      jornada (20 horas) y contratos de fin de semana (viernes noche, sábado y domingo).
      Los turnos son de mañana (11:00 a 16:00), tarde (16:00 a 21:00) y noche (20:00
      a 00:30). El cuadrante se publica cada jueves para la semana siguiente.\nMoto
      y equipo: la empresa pone la moto (125 cc), el casco homologado, la chaqueta,
      el baúl térmico y el soporte del móvil. El combustible, el seguro y el mantenimiento
      corren a cargo de la empresa. El repartidor no necesita moto propia.\nCarné:
      hace falta un carné en vigor que permita conducir una moto de 125 cc: A1, A2,
      A, o B con más de tres años de antigüedad. Se comprueba el original el día de
      la incorporación.\nFormación: el primer día hay una formación pagada de cuatro
      horas en el local, con seguridad vial, uso de la aplicación de reparto y protocolo
      de entrega.\nLocal: cada repartidor está asignado a un único local y empieza
      y termina allí sus turnos. Se puede pedir cambio de local cuando haya vacante.\nSueldo:
      depende de la jornada y del convenio de hostelería de cada provincia. Lo explica
      el encargado del local en la entrevista; el asistente no da cifras.\nPropinas:
      las propinas que dejan los clientes en la aplicación son íntegras para el repartidor.\n\n##
      Preguntas frecuentes de selección\nPreguntas frecuentes de selección (España).\n¿Cómo
      es el proceso? Una conversación corta con la asistente virtual y, si encaja,
      una entrevista de 15 minutos con el encargado del local. La respuesta llega
      en la misma semana.\n¿Necesito moto propia? No. La moto, el casco y el equipo
      los pone la empresa.\n¿Qué carné necesito? A1, A2, A, o B con más de tres años
      de antigüedad.\n¿Cuánto se cobra? Depende de la jornada y del convenio de la
      provincia. Lo explica el encargado en la entrevista.\n¿Puedo elegir local? Se
      te asigna el que tenga vacantes cerca de donde vives. Puedes decir si prefieres
      otro.\n¿Puedo trabajar solo fines de semana? Sí, hay contratos de fin de semana.\n¿Hace
      falta experiencia? No es obligatoria. Se valora haber repartido con aplicaciones
      como Glovo, Uber Eats o Just Eat.\n¿Cuándo empezaría? Las incorporaciones son
      los lunes. Buscamos personas que puedan empezar en los próximos tres meses.\n¿Qué
      pasa con mis datos? Se usan solo para este proceso de selección. Puedes pedir
      que se borren escribiendo a la dirección que aparece en la oferta.\n\n# Mensaje
      propuesto\nGracias, ya tengo anotados tu turno preferido y que podrías empezar
      la semana que viene. ¿Cuáles son tus apellidos?","role":"user","type":"message"}],"max_output_tokens":2048,"reasoning":{"effort":"medium"},"store":false,"text":{"format":{"type":"json_schema","strict":true,"name":"_GuardOutput","schema":{"properties":{"approved":{"title":"Approved","type":"boolean"},"reason":{"title":"Reason","type":"string"}},"required":["approved","reason"],"title":"_GuardOutput","type":"object","additionalProperties":false}}}}'
