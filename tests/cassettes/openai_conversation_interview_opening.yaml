      los campos devueltos; recoge la preferencia del candidato por separado, sin
      presentarla como condici\xF3n confirmada de la vacante.\",\"parameters\":{\"properties\":{\"near\":{\"description\":\"Barrio,
      pueblo o lugar que dice el candidato\",\"maxLength\":120,\"minLength\":1,\"type\":\"string\"},\"shift\":{\"default\":\"any\",\"enum\":[\"morning\",\"afternoon\",\"night\",\"rotating\",\"any\"],\"type\":\"string\"}},\"required\":[\"near\",\"shift\"],\"type\":\"object\",\"additionalProperties\":false},\"strict\":true},{\"type\":\"function\",\"name\":\"application_read_mine\",\"description\":\"Lee
      los datos de la candidatura de la persona con la que hablas: nombre, ciudad
      y puesto.\",\"parameters\":{\"properties\":{},\"type\":\"object\",\"additionalProperties\":false},\"strict\":true},{\"type\":\"function\",\"name\":\"interview_slots\",\"description\":\"Da
      los 3 pr\xF3ximos huecos libres de entrevista en una oportunidad (el site_id
      de openings_find).\",\"parameters\":{\"properties\":{\"site_id\":{\"type\":\"string\"}},\"required\":[\"site_id\"],\"type\":\"object\",\"additionalProperties\":false},\"strict\":true},{\"type\":\"function\",\"name\":\"interview_book\",\"description\":\"Reserva
      un hueco de entrevista (el slot_id de interview_slots). Solo funciona cuando
      la plataforma ya ha marcado a la persona como apta.\",\"parameters\":{\"properties\":{\"slot_id\":{\"type\":\"string\"}},\"required\":[\"slot_id\"],\"type\":\"object\",\"additionalProperties\":false},\"strict\":true},{\"type\":\"function\",\"name\":\"interview_reschedule\",\"description\":\"Cambia
      la entrevista ya reservada de esta persona a otro hueco libre (el slot_id de
      interview_slots). \xDAsala solo si el candidato ha pedido cambiarla y ha elegido
      expresamente ese hueco. Confirma despu\xE9s lo que indique confirmation.\",\"parameters\":{\"properties\":{\"slot_id\":{\"description\":\"slot_id
      del nuevo hueco elegido\",\"maxLength\":60,\"minLength\":1,\"type\":\"string\"}},\"required\":[\"slot_id\"],\"type\":\"object\",\"additionalProperties\":false},\"strict\":true},{\"type\":\"function\",\"name\":\"interview_cancel\",\"description\":\"Cancela
      la entrevista ya reservada de esta persona. \xDAsala solo si el candidato ha
      pedido cancelarla y lo ha confirmado de forma expl\xEDcita. No acepta identificadores:
      siempre act\xFAa sobre su propia entrevista.\",\"parameters\":{\"properties\":{},\"type\":\"object\",\"additionalProperties\":false},\"strict\":true},{\"type\":\"function\",\"name\":\"handoff_request\",\"description\":\"Pasa
      la conversaci\xF3n a una persona del equipo. \xDAsala si el candidato lo pide
      o si no puedes ayudarle.\",\"parameters\":{\"properties\":{\"reason\":{\"maxLength\":300,\"minLength\":1,\"type\":\"string\"},\"urgency\":{\"default\":\"normal\",\"enum\":[\"normal\",\"high\"],\"type\":\"string\"}},\"required\":[\"reason\",\"urgency\"],\"type\":\"object\",\"additionalProperties\":false},\"strict\":true},{\"type\":\"function\",\"name\":\"followup_schedule\",\"description\":\"Programa
