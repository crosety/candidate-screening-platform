      Puedes comprobar vacantes, trayectos, certificados y reservas con ellos.\\n[]\\n\\n#
      Mensaje propuesto\\nGracias, Luc\xEDa. \xBFTienes el carn\xE9 A2 en vigor actualmente?\",\"role\":\"user\",\"type\":\"message\"}],\"max_output_tokens\":2048,\"reasoning\":{\"effort\":\"low\"},\"store\":false,\"text\":{\"format\":{\"type\":\"json_schema\",\"strict\":true,\"name\":\"_GuardOutput\",\"schema\":{\"properties\":{\"approved\":{\"title\":\"Approved\",\"type\":\"boolean\"},\"reason\":{\"title\":\"Reason\",\"type\":\"string\"}},\"required\":[\"approved\",\"reason\"],\"title\":\"_GuardOutput\",\"type\":\"object\",\"additionalProperties\":false}}}}"
