      evidencia en FAQ de esta versi\xF3n. Sin resultados, no inventes respuestas.\",\"parameters\":{\"properties\":{\"query\":{\"maxLength\":500,\"minLength\":1,\"type\":\"string\"}},\"required\":[\"query\"],\"type\":\"object\",\"additionalProperties\":false},\"strict\":true},{\"type\":\"function\",\"name\":\"openings_find\",\"description\":\"Busca
      las oportunidades con vacantes m\xE1s cercanas al lugar que diga el candidato.
