      jornada","fines de semana"]},{"type":"null"}]},"evidence":{"anyOf":[{"type":"string"},{"type":"null"}],"title":"Evidence"},"confidence":{"enum":["high","medium","low"],"title":"Confidence","type":"string"}},"required":["value","evidence","confidence"],"title":"FieldValue","type":"object","additionalProperties":false},"turno":{"properties":{"value":{"anyOf":[{"type":"string","enum":["mañana","tarde","noche","flexible"]},{"type":"null"}]},"evidence":{"anyOf":[{"type":"string"},{"type":"null"}],"title":"Evidence"},"confidence":{"enum":["high","medium","low"],"title":"Confidence","type":"string"}},"required":["value","evidence","confidence"],"title":"FieldValue","type":"object","additionalProperties":false},"experiencia_anios":{"properties":{"value":{"anyOf":[{"type":"number"},{"type":"null"}]},"evidence":{"anyOf":[{"type":"string"},{"type":"null"}],"title":"Evidence"},"confidence":{"enum":["high","medium","low"],"title":"Confidence","type":"string"}},"required":["value","evidence","confidence"],"title":"FieldValue","type":"object","additionalProperties":false},"experiencia_plataforma":{"properties":{"value":{"anyOf":[{"type":"string"},{"type":"null"}]},"evidence":{"anyOf":[{"type":"string"},{"type":"null"}],"title":"Evidence"},"confidence":{"enum":["high","medium","low"],"title":"Confidence","type":"string"}},"required":["value","evidence","confidence"],"title":"FieldValue","type":"object","additionalProperties":false},"incorporacion":{"properties":{"value":{"anyOf":[{"type":"string"},{"type":"null"}]},"evidence":{"anyOf":[{"type":"string"},{"type":"null"}],"title":"Evidence"},"confidence":{"enum":["high","medium","low"],"title":"Confidence","type":"string"}},"required":["value","evidence","confidence"],"title":"FieldValue","type":"object","additionalProperties":false}},"required":["nombre_completo","carnet","tipo_carnet","ciudad","zona","local_asignado","disponibilidad","turno","experiencia_anios","experiencia_plataforma","incorporacion"]},"flags":{"items":{"enu